services:
  embedding:
    build:
      context: .
      args:
        BGE_EXTRA: cpu
    image: bge-m3-embedding-server:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      - model-cache:/home/app/.cache/huggingface
    init: true
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  model-cache:
